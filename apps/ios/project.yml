# XcodeGen spec for the Mercato iOS app.
#
# The .xcodeproj is generated from this file and is NOT committed, the same
# rule the bindings, tokens and localized resources follow. Regenerate with
# ./scripts/gen-ios-project.sh, which also builds everything the project
# references.
name: Mercato
options:
  bundleIdPrefix: com.mercato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # The Rust core is linked as a static library from the xcframework.
    OTHER_LDFLAGS: "-ObjC"
    # Signing, so the app can be put on a real device and not only a simulator.
    # The project is generated, so this has to live here: setting it by hand in
    # Xcode is thrown away by the next ./scripts/gen-ios-project.sh.
    DEVELOPMENT_TEAM: 53S7ZRPGM9
    CODE_SIGN_STYLE: Automatic

packages:
  # AdMob. See docs/specs/ads.md and Sources/AdsManager.swift.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"

targets:
  Mercato:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Generated, hence outside this directory: the FFI bindings, the design
      # tokens, and the localized resources all come from build/.
      - path: ../../build/bindings/swift/mercato_ffi.swift
        group: Generated
      - path: ../../build/tokens/DesignTokens.swift
        group: Generated
      - path: ../../build/strings/ios/en.lproj
        group: Generated
        buildPhase: resources
      - path: ../../build/strings/ios/fr.lproj
        group: Generated
        buildPhase: resources
      - path: ../../build/strings/ios/es.lproj
        group: Generated
        buildPhase: resources
      # The dataset ships with the app; the core reads these CSVs at startup.
      # Generated from the design tokens by scripts/gen-app-icon.mjs.
      - path: ../../build/icons/ios/Assets.xcassets
        group: Generated
      # Apple requires this for the required-reason APIs the app touches.
      - path: Support/PrivacyInfo.xcprivacy
        group: Resources
        buildPhase: resources
      - path: Support/Products.storekit
        group: Support
        buildPhase: none
      - path: ../../data
        group: Resources
        buildPhase: resources
        excludes:
          - "*.md"
      # Committed, not generated: see design/fonts/README.md.
      - path: ../../design/fonts
        group: Resources
        buildPhase: resources
        excludes:
          - "*.md"
          - "*.txt"
    dependencies:
      - framework: ../../build/ios/Mercato.xcframework
        embed: false
      - package: GoogleMobileAds
    scheme:
      # Local StoreKit products, so the purchase can be exercised without an
      # App Store Connect entry. See Support/README.md.
      storeKitConfiguration: Support/Products.storekit
      testTargets:
        - MercatoTests
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Mercato
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # AdMob. The application ID must be present or the SDK aborts on
        # start-up. See docs/specs/ads.md.
        GADApplicationIdentifier: ca-app-pub-5435447054359850~6829263654
        NSUserTrackingUsageDescription: "We use your advertising identifier to make the ads you see more relevant. You can play without allowing it."
        # AdMob attribution networks. This is the subset Google publishes for
        # AdMob; extend it from the current AdMob documentation before release.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
