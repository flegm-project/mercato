        # An empty dict flashes white before the splash. Painting the launch
        # screen in the app's own background makes the hand-off invisible.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The game reads the system language and falls back to English; there
        # is no in-app picker.
        CFBundleLocalizations:
          - en
          - fr
          - es
        CFBundleDevelopmentRegion: en
        UIAppFonts:
          - Unbounded-ExtraBold.ttf
          - Unbounded-Black.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - Figtree-ExtraBold.ttf
          - Figtree-Black.ttf
          - IBMPlexMono-Medium.ttf

  MercatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The same product definitions the app ships against locally, so the
      # test buys exactly what the player would.
      - path: Support/Products.storekit
        buildPhase: resources
    dependencies:
      - target: Mercato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mercato.app/Mercato
