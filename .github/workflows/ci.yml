name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Rust core (test + parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (parity fixtures + dataset integrity)
        run: cargo test --all

  assets:
    name: Generated assets (strings + design tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Catches invisible dataset corruption (a digit standing in for a letter,
      # a Greek alpha instead of a Latin A) and referential integrity.
      - name: Dataset checks
        run: node scripts/check-data.mjs

      # gen-strings validates before it emits, so this fails the build if the
      # three languages ever drift apart or a value is left empty.
      - name: Localized strings
        run: node scripts/gen-strings.mjs

      - name: Design tokens
        run: node scripts/gen-design-tokens.mjs

      # Generated output is never committed; catch it if someone adds it.
      - name: Generated output stays untracked
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generators dirtied the working tree:"
            git status --porcelain
            exit 1
          fi

  native:
    name: Native output (Swift runtime smoke test + Swift/Kotlin compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: macos-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      # Compiles the generated bindings against the real library and plays a
      # round, so a break in the Rust-to-Swift chain fails here rather than in
      # the app build.
      - name: Swift smoke test
        run: ./scripts/smoke-swift.sh

      # Generated code must actually compile. Counting braces is not enough:
      # that is exactly how a reserved-name bug reached the generated Swift.
      - name: Typecheck generated Swift tokens
        run: |
          node scripts/gen-design-tokens.mjs
          xcrun --sdk iphonesimulator swiftc -parse-as-library -typecheck \
            -target arm64-apple-ios17.0-simulator \
            build/tokens/DesignTokens.swift

      - name: Install Kotlin
        run: brew install kotlin

      - name: Compile generated Kotlin tokens
        run: ./scripts/check-kotlin-tokens.sh

  android:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/target
          key: android-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      # The app consumes generated inputs from build/: UniFFI Kotlin bindings,
      # per-ABI .so files, design tokens, localized resources.
      - name: Generate app inputs
        run: |
          ./scripts/build-native.sh android
          node scripts/gen-design-tokens.mjs
          node scripts/gen-strings.mjs

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: cd apps/android && ./gradlew --no-daemon assembleDebug
