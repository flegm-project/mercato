name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Rust core (test + parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (parity fixtures + dataset integrity)
        run: cargo test --all

  assets:
    name: Generated assets (strings + design tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Catches invisible dataset corruption (a digit standing in for a letter,
      # a Greek alpha instead of a Latin A) and referential integrity.
      - name: Dataset checks
        run: node scripts/check-data.mjs

      # gen-strings validates before it emits, so this fails the build if the
      # three languages ever drift apart or a value is left empty.
      - name: Localized strings
        run: node scripts/gen-strings.mjs

      - name: Design tokens
        run: node scripts/gen-design-tokens.mjs

      # Mistakes that compile, run, and are visible only to someone looking at
      # the screen: a height-only Gap used inside a Row, an opaque fill stroked
      # with a border. Both shipped before this check existed.
      - name: Compose idioms
        run: node scripts/check-ui-idioms.mjs

      # iOS is the reference; this fails when a literal style value exists on
      # one platform and not the other.
      - name: Design parity
        run: node scripts/check-design-parity.mjs

      # Generated output is never committed; catch it if someone adds it.
      - name: Generated output stays untracked
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generators dirtied the working tree:"
            git status --porcelain
            exit 1
          fi

  native:
    name: Native output (Swift runtime smoke test + Swift/Kotlin compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: macos-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      # Compiles the generated bindings against the real library and plays a
      # round, so a break in the Rust-to-Swift chain fails here rather than in
      # the app build.
      - name: Swift smoke test
        run: ./scripts/smoke-swift.sh

      # Generated code must actually compile. Counting braces is not enough:
      # that is exactly how a reserved-name bug reached the generated Swift.
      - name: Typecheck generated Swift tokens
        run: |
          node scripts/gen-design-tokens.mjs
          xcrun --sdk iphonesimulator swiftc -parse-as-library -typecheck \
            -target arm64-apple-ios17.0-simulator \
            build/tokens/DesignTokens.swift

      - name: Install Kotlin
        run: brew install kotlin

      - name: Compile generated Kotlin tokens
        run: ./scripts/check-kotlin-tokens.sh

  android:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle build generates the launcher icon, and that generator
      # rasterises with rsvg-convert. The runner does not ship it, so every
      # Android job since the icon started being generated at build time has
      # failed on :app:genIcons, which is why this workflow has been red for
      # weeks while everyone kept pushing.
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/target
          key: android-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      # The app consumes generated inputs from build/: UniFFI Kotlin bindings,
      # per-ABI .so files, design tokens, localized resources.
      - name: Generate app inputs
        run: |
          ./scripts/build-native.sh android
          node scripts/gen-design-tokens.mjs
          node scripts/gen-strings.mjs

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK and run unit tests
        run: cd apps/android && ./gradlew --no-daemon assembleDebug testDebugUnitTest

  ui:
    name: Android UI (instrumented, emulator)
    runs-on: ubuntu-latest
    # The screens are what everything else is for, and they are also what no
    # other job looks at: the whole suite above passed green on a build whose
    # replay button did nothing and whose Hardcore controls sat under the
    # keyboard. This job is the one that opens the app.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/target
          key: ui-cargo-${{ hashFiles('core/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Generate app inputs
        run: |
          ./scripts/build-native.sh android
          node scripts/gen-design-tokens.mjs
          node scripts/gen-strings.mjs

      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the emulator usable rather than a twenty-minute wait.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: cd apps/android && ./gradlew --no-daemon connectedDebugAndroidTest
