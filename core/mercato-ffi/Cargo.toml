[package]
name = "mercato-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI surface for Mercato: the Game facade the iOS and Android apps call."

[lib]
# staticlib -> iOS xcframework, cdylib -> Android .so, lib -> Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]
name = "mercato_ffi"

[dependencies]
mercato-core = { path = "../mercato-core" }
mercato-data = { path = "../mercato-data" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = { workspace = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
