[package]
name = "mercato-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI surface for Mercato: the Game facade the native (iOS/Android) apps call."

[lib]
name = "mercato_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
mercato-core = { path = "../mercato-core" }
mercato-data = { path = "../mercato-data" }
uniffi = "0.29"

[features]
cli = ["uniffi/cli"]

[dev-dependencies]
tempfile = "3"
