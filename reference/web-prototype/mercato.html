<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1B2FE0">
<title>MERCATO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Figtree:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --field:#1B2FE0; --field-d:#1223A6;
  --card:#FBFAF4; --ink:#0B1030; --edge:#0B1030;
  --deep:#0F1A66;
  --zap:#FFE24A; --zap-d:#C9A800;
  --mint:#2FE0A0; --mint-d:#159C6B;
  --coral:#FF5C63; --coral-d:#C22E36;
  --disp:"Unbounded",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--field);
  background-image:radial-gradient(130% 90% at 50% 0%,#2E48FF 0%,var(--field) 46%,var(--field-d) 100%);
  color:#fff;font-family:var(--ui);font-size:18px;font-weight:600;line-height:1.35;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
#app{max-width:470px;margin:0 auto;min-height:100%;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}

/* ================= boutons epais ================= */
.tap{
  font-family:var(--disp);font-weight:800;cursor:pointer;
  border:3px solid var(--edge);border-radius:20px;
  padding:19px 18px;font-size:19px;letter-spacing:-.02em;width:100%;
  background:var(--zap);color:var(--ink);box-shadow:0 7px 0 var(--edge);
  transition:transform .07s,box-shadow .07s;
}
.tap:active{transform:translateY(6px);box-shadow:0 1px 0 var(--edge)}
.tap.pale{background:var(--card);color:var(--ink)}
.tap.ghost{background:transparent;border-color:rgba(255,255,255,.34);color:#fff;
  box-shadow:none;font-family:var(--ui);font-weight:800;font-size:16px;padding:14px}
.tap.ghost:active{transform:none;box-shadow:none;background:rgba(255,255,255,.1)}
.tap:disabled{opacity:.45;box-shadow:0 7px 0 var(--edge);transform:none;cursor:default}

/* ================= accueil ================= */
.logo{font-family:var(--disp);font-weight:900;font-size:clamp(58px,19vw,90px);
  line-height:.82;letter-spacing:-.055em;margin:26px 0 10px;
  text-shadow:5px 5px 0 var(--edge)}
.logo em{font-style:normal;color:var(--zap)}
.tag{font-size:19px;font-weight:600;color:rgba(255,255,255,.72);margin:0 0 26px;max-width:15em;line-height:1.25}
.streak-hero{display:flex;align-items:center;gap:11px;margin:0 0 20px;
  font-family:var(--disp);font-weight:800;font-size:17px}
.streak-hero b{font-size:46px;color:var(--zap);line-height:.9;text-shadow:3px 3px 0 var(--edge)}
.menu{display:grid;gap:13px;margin-top:auto}
.menu .tap{padding:22px 18px;font-size:23px;border-radius:22px}
.menu small{display:block;font-family:var(--ui);font-weight:700;font-size:13px;opacity:.6;margin-top:6px}
.home-foot{display:flex;justify-content:center;margin-top:18px}
.linkish{background:none;border:0;color:rgba(255,255,255,.5);font-size:14px;font-weight:700;
  font-family:var(--ui);cursor:pointer;padding:8px}

/* ================= barre de jeu ================= */
.gbar{display:flex;align-items:center;gap:10px;height:52px}
.back{background:none;border:0;color:#fff;font-family:var(--disp);font-weight:800;
  font-size:34px;cursor:pointer;padding:0 6px 0 0;line-height:.8}
.pips{display:flex;gap:6px;flex:1}
.pip{width:11px;height:11px;border-radius:99px;background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.28)}
.pip.w{background:var(--mint);border-color:var(--edge)}
.pip.l{background:var(--coral);border-color:var(--edge)}
.flame{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--zap)}
.scorewrap{position:relative}
.score{
  font-family:var(--disp);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums;
  background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:999px;
  padding:6px 16px;box-shadow:0 4px 0 var(--edge);transition:background .2s,color .2s;
}
.score.up{background:var(--mint)}
.score.down{background:var(--coral);color:#fff}
.bump{
  position:absolute;right:8px;top:-2px;font-family:var(--disp);font-weight:900;font-size:26px;
  opacity:0;pointer-events:none;text-shadow:3px 3px 0 var(--edge);
}
.bump.go{animation:fly .9s cubic-bezier(.2,.9,.3,1) forwards}
.bump.plus{color:var(--mint)} .bump.zero{color:var(--coral)}
@keyframes fly{0%{opacity:0;transform:translateY(4px) scale(.7)}
  25%{opacity:1;transform:translateY(-14px) scale(1.25)}
  100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* ================= la carte ================= */
.card{
  background:var(--card);color:var(--ink);border:4px solid var(--edge);border-radius:26px;
  margin:12px 0 14px;position:relative;overflow:hidden;
  box-shadow:0 10px 0 var(--edge),0 22px 44px rgba(4,8,50,.42);
  animation:pop .3s cubic-bezier(.2,1.15,.35,1);
}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.yearband{
  background:var(--ink);color:var(--zap);font-family:var(--disp);font-weight:900;
  font-size:clamp(32px,10vw,46px);line-height:1;letter-spacing:.05em;
  text-align:center;padding:9px 8px 12px;
}
.ykind{display:block;font-family:var(--disp);font-weight:800;font-size:13px;
  letter-spacing:.2em;color:rgba(255,255,255,.58);margin-bottom:3px}
.cardin{padding:22px 16px 20px}
.leg{text-align:center}
.leg-club{font-family:var(--disp);font-weight:800;font-size:clamp(24px,7.4vw,34px);
  line-height:1.1;letter-spacing:-.035em}
.leg-club.origin{color:#8288A4}
.track{height:66px;display:flex;align-items:center;justify-content:center;position:relative;margin:8px 0}
.track:before{content:"";position:absolute;top:2px;bottom:12px;width:6px;border-radius:9px;
  background:repeating-linear-gradient(180deg,var(--ink) 0 9px,transparent 9px 18px);opacity:.28}
.track:after{content:"";position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-top:12px solid var(--ink);opacity:.28}
.token{width:44px;height:44px;border-radius:99px;background:var(--ink);color:var(--zap);
  border:3px solid var(--edge);display:grid;place-items:center;
  font-family:var(--disp);font-weight:900;font-size:20px;
  position:relative;z-index:1;transform:translateY(-16px);
  transition:transform .6s cubic-bezier(.65,0,.2,1),background .3s,color .3s}
.card.done .token{transform:translateY(16px);background:var(--mint);color:var(--ink)}
.card.miss .token{transform:translateY(16px);background:var(--coral);color:#fff}
.reveal{font-family:var(--disp);font-weight:900;font-size:clamp(24px,7.2vw,33px);
  letter-spacing:-.035em;line-height:1.06;margin-top:16px;text-align:center;
  opacity:0;transform:translateY(8px);transition:opacity .28s .34s,transform .28s .34s}
.card.done .reveal,.card.miss .reveal{opacity:1;transform:none}
.card.done .reveal{color:var(--mint-d)}
.card.miss .reveal{color:var(--coral-d)}
.card.done,.card.miss{cursor:pointer}
.card.done{border-color:var(--mint-d);box-shadow:0 10px 0 var(--mint-d),0 22px 44px rgba(4,8,50,.42)}
.card.miss{border-color:var(--coral-d);box-shadow:0 10px 0 var(--coral-d),0 22px 44px rgba(4,8,50,.42)}
.field input.ok{background:var(--mint);box-shadow:0 6px 0 var(--mint-d)}
.field input.no{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-d)}
.masked{text-align:center;margin-top:16px;font-family:var(--disp);font-weight:900;
  font-size:clamp(24px,7.2vw,33px);letter-spacing:.1em;color:#D6D3C4}

/* ================= reponses ================= */
.opts{display:grid;gap:11px}
.opt{
  font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.03em;text-align:left;
  background:var(--deep);color:#fff;border:3px solid var(--edge);border-radius:18px;
  padding:17px 17px;cursor:pointer;box-shadow:0 6px 0 var(--edge);
  transition:transform .07s,box-shadow .07s,background .15s;
}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.opt.ok{background:var(--mint);color:var(--ink)}
.opt.no{background:var(--coral);color:#fff}
.opt:disabled{cursor:default;opacity:.6}
.opt.ok:disabled,.opt.no:disabled{opacity:1}
.field{position:relative}
.field input{width:100%;font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.03em;
  padding:18px 16px;border-radius:18px;border:3px solid var(--edge);
  background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--edge)}
.field input::placeholder{color:#9A9788;font-family:var(--ui);font-weight:700;font-size:17px;letter-spacing:0}
.field input:focus{outline:0;background:#fff;box-shadow:0 6px 0 var(--zap-d)}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 10px);z-index:30;background:var(--deep);
  border:3px solid var(--edge);border-radius:18px;overflow:hidden;max-height:230px;overflow-y:auto;
  box-shadow:0 -8px 0 rgba(11,16,48,.3)}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;
  font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.03em;
  padding:14px 16px;cursor:pointer;border-bottom:2px solid rgba(255,255,255,.1)}
.sug button:last-child{border-bottom:0}
.sug button.cur,.sug button:hover{background:var(--zap);color:var(--ink)}
.hintrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hintchip{background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:999px;
  padding:7px 14px;font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:-.02em}
.tries{display:flex;gap:7px;align-items:center;justify-content:center;margin-bottom:12px}
.heart{width:14px;height:14px;border-radius:99px;background:var(--zap);border:3px solid var(--edge)}
.heart.off{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .tap{flex:1}
.acts .tap.mini{flex:0 0 42%}

/* ================= labo ================= */
.lab{background:var(--card);color:var(--ink);border:4px solid var(--edge);border-radius:24px;
  padding:18px;margin-top:12px;box-shadow:0 8px 0 var(--edge)}
.lab h3{font-family:var(--disp);font-weight:900;font-size:20px;margin:22px 0 8px;letter-spacing:-.03em}
.lab h3:first-of-type{margin-top:0}
.lab label{display:block;font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:#4C5372;margin:14px 0 6px}
.lab select,.lab input[type=text]{width:100%;font-family:var(--ui);font-weight:700;font-size:17px;
  padding:13px;border-radius:14px;border:3px solid var(--edge);background:#fff;color:var(--ink)}
.lab input[type=range]{width:100%}
.kv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:2px solid rgba(11,16,48,.09)}
.kv span:last-child{font-weight:800;text-align:right}
.pill{padding:3px 11px;border-radius:99px;font-family:var(--disp);font-size:12px;font-weight:800;color:#fff}
.pill.y{background:var(--mint-d)} .pill.n{background:var(--coral-d)} .pill.w{background:#A87400}
.amb{font-size:14px;font-weight:600;line-height:1.75;max-height:190px;overflow:auto}
.amb b{color:var(--coral-d);font-family:var(--disp);font-weight:800}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;padding:13px 20px;
  border:3px solid var(--edge);border-radius:999px;z-index:80;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
:focus-visible{outline:4px solid var(--zap);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="scHome">
    <h1 class="logo">MER<em>CATO</em></h1>
    <p class="tag" id="homeTag"></p>
    <div class="streak-hero" id="streakHero" hidden><b id="streakN">0</b><span id="streakL"></span></div>
    <div class="menu">
      <button class="tap" data-go="l1"></button>
      <button class="tap pale" data-go="l3"></button>
    </div>
    <div class="home-foot"><button class="linkish" data-go="lab" id="btnLab"></button></div>
  </section>

  <section class="screen" id="scGame">
    <div class="gbar">
      <button class="back" data-go="home" aria-label="Retour">‹</button>
      <div class="pips" id="pips"></div>
      <div class="flame" id="flame"></div>
      <div class="scorewrap">
        <div class="score" id="score">0</div>
        <div class="bump" id="bump"></div>
      </div>
    </div>
    <div id="cardHost"></div>
    <div id="answerHost" style="margin-top:auto"></div>
  </section>

  <section class="screen" id="scLab">
    <div class="gbar"><button class="back" data-go="home" aria-label="Retour">‹</button></div>
    <div id="labHost"></div>
  </section>

</div>

function normalize(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[ØøŁłÐðÞþ]/g,m=>({"Ø":"O","ø":"o","Ł":"L","ł":"l","Ð":"D","ð":"d","Þ":"T","þ":"t"}[m]))
    .toLowerCase().replace(/[.'’`\-_]/g," ").replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  if(a===b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  let prev=new Array(b.length+1);
  for(let j=0;j<=b.length;j++) prev[j]=j;
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++){
      const c=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
    }
    prev=cur;
  }
  return prev[b.length];
}
function thresholdFor(str,base){
  if(str.length<=4) return 0;
  if(str.length<=6) return Math.min(1,base);
  return base;
}
function namesOf(p){
  const set=new Set([p.n.fr,p.n.en,p.n.es].concat(p.alt||[]));
  return Array.from(set);
}
/* Particules de nom : van Dijk, de Bruyne, Di Maria, dos Santos...
   Sans elles, "van dijk" ne correspond a rien. */
const PARTICLES=new Set(["van","von","de","del","della","di","da","do","dos","das",
  "du","des","le","la","el","al","bin","ibn","ter","ten","st","mc","mac","o","van't","der","den"]);

function surnameVariants(name){
  const tk=normalize(name).split(" ").filter(Boolean);
  if(tk.length<2) return [tk[0]||""];
  let i=tk.length-1;
  while(i-1>=1 && PARTICLES.has(tk[i-1])) i--;   // on ne mange jamais le prenom
  const full=tk.slice(i).join(" "), bare=tk[tk.length-1];
  return full===bare?[bare]:[full,bare];
}
function surnameOf(name){ return surnameVariants(name)[0]; }

const SURNAME_INDEX=(()=>{
  const idx={};
  for(const id in PLAYERS){
    for(const nm of [PLAYERS[id].n.fr,PLAYERS[id].n.en,PLAYERS[id].n.es]){
      for(const s of surnameVariants(nm)){
        if(!s) continue;
        (idx[s]=idx[s]||new Set()).add(id);
      }
    }
  }
  const o={}; for(const k in idx) o[k]=Array.from(idx[k]);
  return o;
})();
const AMBIGUOUS=Object.keys(SURNAME_INDEX).filter(s=>SURNAME_INDEX[s].length>1).sort();

/* Index de toutes les formes exactes de la base : noms complets et noms de famille.
   Regle cardinale : une correspondance approchee ne doit jamais l'emporter sur une
   correspondance exacte avec un AUTRE joueur. Sans cela, "kane" passe pour Kante. */
const EXACT_INDEX=(()=>{
  const idx={};
  const add=(k,id)=>{ if(k) (idx[k]=idx[k]||new Set()).add(id); };
  for(const id in PLAYERS){
    const p=PLAYERS[id];
    for(const nm of namesOf(p)){
      add(normalize(nm),id);
      surnameVariants(nm).forEach(v=>add(v,id));
    }
  }
  const o={}; for(const k in idx) o[k]=Array.from(idx[k]);
  return o;
})();

function claimedByOther(g,pid){
  const owners=EXACT_INDEX[g];
  return !!owners && owners.indexOf(pid)===-1;
}

function matchAnswer(guess,pid,base){
  base=(base===undefined)?2:base;
  const p=PLAYERS[pid], g=normalize(guess);
  const out={ok:false,route:"none",dist:null,matched:null,ambiguous:false};
  if(!g) return out;
  const cands=namesOf(p);
  const canon=new Set([p.n.fr,p.n.en,p.n.es].map(normalize));
  for(const c of cands){
    if(g===normalize(c)){
      out.ok=true; out.dist=0; out.matched=c;
      out.route=canon.has(normalize(c))?"exact":"alias";
      return out;
    }
  }
  let best={d:Infinity,c:null};
  for(const c of cands){
    const d=levenshtein(g,normalize(c));
    if(d<best.d) best={d:d,c:c};
  }
  if(best.c && best.d<=thresholdFor(normalize(best.c),base) && !claimedByOther(g,pid)){
    out.ok=true; out.route="fuzzy"; out.dist=best.d; out.matched=best.c; return out;
  }
  const vars=new Set();
  for(const nm of [p.n.en,p.n.fr,p.n.es]) surnameVariants(nm).forEach(v=>vars.add(v));
  let hit=null;
  for(const sn of vars){
    if(!sn) continue;
    const d=levenshtein(g,sn);
    if(d<=thresholdFor(sn,base) && (hit===null||d<hit.d)) hit={sn:sn,d:d};
  }
  if(hit){
    out.dist=hit.d; out.matched=hit.sn; out.route="surname";
    if(hit.d>0 && claimedByOther(g,pid)){ out.ok=false; out.route="none"; return out; }
    if((SURNAME_INDEX[hit.sn]||[]).length>1){ out.ambiguous=true; out.ok=false; }
    else out.ok=true;
    return out;
  }
  out.dist=best.d; out.matched=best.c;
  return out;
}

function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

const MAX_LINKS=Math.max.apply(null,Object.keys(PLAYERS).map(id=>PLAYERS[id].l||0));
function distractorsFor(pid,rng){
  const tg=PLAYERS[pid];
  const score=id=>{
    const p=PLAYERS[id]; let s=0;
    if(p.pos===tg.pos) s+=3;
    if(p.b&&tg.b&&Math.abs(p.b-tg.b)<=6) s+=2;
    if(p.nat===tg.nat) s+=1;
    // un leurre doit etre aussi connu que la reponse, sinon il ne trompe personne
    s+=2*(p.l||0)/MAX_LINKS;
    s-=1.5*Math.abs((p.l||0)-(tg.l||0))/MAX_LINKS;
    return s;
  };
  return Object.keys(PLAYERS).filter(id=>id!==pid)
    .map(id=>({id:id,s:score(id)+rng()*0.9}))
    .sort((a,b)=>b.s-a.s).slice(0,3).map(o=>o.id);
}
function shuffle(a,rng){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;}

/* ---------- selection des dossiers ---------- */
/* La difficulte tient au mode de reponse, pas seulement a la rarete du transfert.
   Facile : QCM sur les dossiers grand public. Hardcore : saisie libre sur toute la base. */
function poolFor(m){
  if(m==="l1") return TRANSFERS.filter(x=>x.d<=2);
  return TRANSFERS;
}

/* ---------- etat ---------- */
const PTS_WIN=3, PTS_LOSS=0;
/* La langue suit le reglage systeme. Dans l'app native, ce sera Locale.preferredLanguages
   sur iOS et Resources.getConfiguration().locales sur Android. Pas de selecteur maison. */
const SUPPORTED=["fr","en","es"];
const SYS_LANG=(()=>{
  const l=((typeof navigator!=="undefined"&&navigator.language)||"en").slice(0,2).toLowerCase();
  return SUPPORTED.indexOf(l)>=0?l:"en";
})();
const S={lang:SYS_LANG,screen:"home",mode:"l1",q:null,tries:3,hints:0,done:false,
         streak:0,score:0,run:[],threshold:2,sug:-1};
const $=s=>document.querySelector(s);
const t=()=>T[S.lang];
const club=id=>CLUBS[id][S.lang];
const pname=id=>PLAYERS[id].n[S.lang];

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2000);}

/* ---------- navigation ---------- */
function go(dest){
  clearTimeout(go._t);
  if(dest==="home"){ S.screen="home"; show("scHome"); paintHome(); return; }
  if(dest==="lab"){ S.screen="lab"; show("scLab"); paintLab(); return; }
  S.mode=dest; S.screen="game"; S.run=[]; S.score=0;
  const sc=$("#score"); if(sc){sc.textContent="0";sc.classList.remove("up","down");}
  show("scGame"); nextQ();
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0);}

function paintHome(){
  const L=t();
  document.documentElement.lang=S.lang;
  $("#homeTag").textContent=L.tag;
  const menu=document.querySelectorAll(".menu .tap");
  [["l1","s1"],["l3","s3"]].forEach((k,i)=>{
    menu[i].innerHTML=L[k[0]]+"<small>"+L[k[1]]+"</small>";
  });
  $(".home-foot").innerHTML=`<button class="linkish" data-go="lab">${L.lab}</button>`;
  $("#streakHero").hidden=S.streak<1;
  $("#streakN").textContent=S.streak;
  $("#streakL").textContent=L.streak;
}

/* ---------- partie ---------- */
function nextQ(){
  const pool=poolFor(S.mode);
  const rng=mulberry32((Math.random()*1e9)|0);
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const lvl=(S.mode==="l3")?3:1;
  S.q={tr:pick,lvl:lvl,opts:lvl===1?shuffle(distractorsFor(pick.p,rng).concat([pick.p]),rng):null};
  S.tries=lvl===3?3:1; S.hints=0; S.done=false; S.sug=-1;
  paintGame();
}

function paintGame(){
  const L=t(),q=S.q,tr=q.tr;
  $("#flame").textContent=S.streak>0?"🔥 "+S.streak:"";
  $("#pips").innerHTML=S.run.slice(-6).map(w=>`<i class="pip ${w?"w":"l"}"></i>`).join("")
    +`<i class="pip"></i>`;
  $("#score").textContent=S.score;
  $("#cardHost").innerHTML=`
    <div class="card" id="card">
      <div class="yearband"><span class="ykind">${L[tr.k]}</span>${tr.y}</div>
      <div class="cardin">
        <div class="leg"><div class="leg-club origin">${club(tr.f)}</div></div>
        <div class="track"><div class="token">?</div></div>
        <div class="leg"><div class="leg-club">${club(tr.t)}</div></div>
        ${q.lvl===3?`<div class="masked" id="masked">${maskOf(pname(tr.p))}</div>`:""}
        <div class="reveal" id="reveal">${pname(tr.p)}</div>
      </div>
    </div>`;
  paintAnswers();
}
function maskOf(n){return n.split(" ").map(w=>"•".repeat(Math.min(w.length,9))).join("  ");}

function paintAnswers(){
  const L=t(),q=S.q,host=$("#answerHost");
  if(q.lvl===1){
    host.innerHTML=`<div class="opts">${q.opts.map(id=>`<button class="opt" data-id="${id}">${pname(id)}</button>`).join("")}</div>
`;
    host.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(pname(b.dataset.id),b));
  }else{
    host.innerHTML=`
      ${q.lvl===3?`<div class="tries" id="tries"></div>`:""}
      <div class="hintrow" id="hints"></div>
      <div class="field">
        <input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="${q.lvl===2?L.ph2:L.ph3}" aria-label="${L.who}">
        <div class="sug" id="sug" hidden></div>
      </div>
      <div class="acts">
        ${q.lvl===3?`<button class="tap pale mini" id="bHint">${L.hint}</button>`:""}
        <button class="tap" id="bGo">${L.go}</button>
      </div>
`;
    const inp=$("#in");
    $("#bGo").onclick=()=>answer(inp.value);
    if(q.lvl===3){ $("#bHint").onclick=()=>{if(S.hints<3){S.hints++;paintHints();}}; }
    if(q.lvl===2){ inp.addEventListener("input",()=>suggest(inp.value)); inp.addEventListener("keydown",sugKeys); }
    else inp.addEventListener("keydown",e=>{if(e.key==="Enter")answer(inp.value);});
    paintHints(); setTimeout(()=>inp.focus(),60);
  }
}

function paintHints(){
  const L=t(),p=PLAYERS[S.q.tr.p];
  const tr=$("#tries");
  if(tr) tr.innerHTML=[0,1,2].map(i=>`<i class="heart ${i<S.tries?"":"off"}"></i>`).join("");
  const h=$("#hints"); if(!h) return;
  const c=[];
  if(S.q.lvl===3){
    if(S.hints>=1&&p.nat&&NATS[p.nat]) c.push(`<span class="hintchip">${L.nat} <b>${NATS[p.nat][S.lang]||NATS[p.nat].en}</b></span>`);
    if(S.hints>=2&&p.pos) c.push(`<span class="hintchip">${L.posL} <b>${POS[p.pos][S.lang]}</b></span>`);
    if(S.hints>=3){const sn=pname(S.q.tr.p).split(" ").pop();
      c.push(`<span class="hintchip">${L.initial} <b>${sn[0].toUpperCase()}</b></span>`,
             `<span class="hintchip"><b>${sn.length}</b> ${L.letters}</span>`);}
  }
  h.innerHTML=c.join("");
}

function suggest(v){
  const box=$("#sug"),g=normalize(v);
  if(g.length<2){box.hidden=true;box.innerHTML="";S.sug=-1;return;}
  const hits=Object.keys(PLAYERS).filter(id=>
    namesOf(PLAYERS[id]).map(normalize).some(c=>c.includes(g)||c.split(" ").some(w=>w.startsWith(g))))
    .sort((a,b)=>PLAYERS[b].l-PLAYERS[a].l).slice(0,6);
  if(!hits.length){box.hidden=true;box.innerHTML="";S.sug=-1;return;}
  box.innerHTML=hits.map(id=>`<button data-id="${id}">${pname(id)}</button>`).join("");
  box.hidden=false;S.sug=-1;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{box.hidden=true;answer(pname(b.dataset.id));});
}
function sugKeys(e){
  const box=$("#sug");
  if(box.hidden){ if(e.key==="Enter")answer($("#in").value); return; }
  const it=Array.from(box.querySelectorAll("button"));
  if(e.key==="ArrowDown"){e.preventDefault();S.sug=Math.min(S.sug+1,it.length-1);}
  else if(e.key==="ArrowUp"){e.preventDefault();S.sug=Math.max(S.sug-1,0);}
  else if(e.key==="Enter"){e.preventDefault(); S.sug>=0?it[S.sug].click():answer($("#in").value); return;}
  else if(e.key==="Escape"){box.hidden=true;return;}
  it.forEach((b,i)=>b.classList.toggle("cur",i===S.sug));
}

function answer(val,btn){
  if(S.done) return;
  const r=matchAnswer(val,S.q.tr.p,S.threshold);
  if(r.ok) return finish(true,r,btn);
  if(S.q.lvl===3&&S.tries>1&&!r.ambiguous){
    S.tries--; S.hints=Math.min(3,S.hints+1); paintHints();
    const i=$("#in"); if(i){i.select();}
    toast(t().rNone); return;
  }
  if(r.ambiguous){ toast(t().rAmb); return; }
  finish(false,r,btn);
}

/* Le compteur garde la couleur du dernier resultat : vert si gagne, rouge si rate. */
function bumpScore(won){
  const sc=$("#score"), bp=$("#bump");
  sc.textContent=S.score;
  sc.classList.remove("up","down"); void sc.offsetWidth;
  sc.classList.add(won?"up":"down");
  bp.className="bump "+(won?"plus":"zero");
  bp.textContent=(won?"+"+PTS_WIN:"+"+PTS_LOSS);
  void bp.offsetWidth; bp.classList.add("go");
}

function finish(won,r,btn){
  S.done=true; S.run.push(won);
  S.streak = won ? S.streak+1 : 0;
  S.delta = won ? PTS_WIN : PTS_LOSS;
  S.score += S.delta;
  bumpScore(won);
  const card=$("#card");
  card.classList.add(won?"done":"miss");
  const m=$("#masked"); if(m) m.style.display="none";
  $("#flame").textContent=S.streak>0?"🔥 "+S.streak:"";
  if(S.q.lvl===1){
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled=true;
      if(b.dataset.id===S.q.tr.p) b.classList.add("ok");
    });
    if(!won&&btn) btn.classList.add("no");
  }else{
    const i=$("#in"); if(i){ i.disabled=true; i.classList.add(won?"ok":"no");
      if(!won) i.value=pname(S.q.tr.p); }
    const g=$("#bGo"); if(g) g.disabled=true;
    const h=$("#bHint"); if(h) h.disabled=true;
    const s=$("#sug"); if(s) s.hidden=true;
  }
  card.onclick=advance;
  // Plus d'ecran d'explication : la carte se colore, le score s'incremente, on enchaine.
  go._t=setTimeout(advance,1900);
}

function advance(){ clearTimeout(go._t); nextQ(); }

/* ---------- labo ---------- */
function paintLab(){
  const L=t();
  const ids=Object.keys(PLAYERS).sort((a,b)=>PLAYERS[b].l-PLAYERS[a].l);
  const amb=Object.keys(SURNAME_INDEX).filter(s=>SURNAME_INDEX[s].length>1).sort();
  $("#labHost").innerHTML=`
   <div class="lab">
    <h3>${L.labT}</h3>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:0">${L.labN}</p>
    <label for="lt">${L.labTarget}</label>
    <select id="lt">${ids.map(i=>`<option value="${i}">${pname(i)}</option>`).join("")}</select>
    <label for="lg">${L.labGuess}</label>
    <input id="lg" type="text" spellcheck="false" placeholder="mbape · zizou · van dijk · silva">
    <label for="lth">${L.labTh} : <span id="lthv">${S.threshold}</span></label>
    <input id="lth" type="range" min="0" max="3" step="1" value="${S.threshold}">
    <div class="kv" id="ltrace" style="margin-top:12px"></div>
    <h3>${L.stats}</h3>
    <div class="kv">
      <div><span>${L.sClubs}</span><span>${Object.keys(CLUBS).length}</span></div>
      <div><span>${L.sPlayers}</span><span>${ids.length}</span></div>
      <div><span>${L.sTr}</span><span>${TRANSFERS.length}</span></div>
      <div><span>${L.sGold}</span><span>${TRANSFERS.filter(x=>x.g===1).length}</span></div>
      <div><span>${L.sAmb}</span><span>${amb.length}</span></div>
    </div>
    <h3>${L.ambT}</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 8px">${L.ambN}</p>
    <div class="amb">${amb.map(s=>`<div><b>${s}</b> · ${SURNAME_INDEX[s].map(pname).join(", ")}</div>`).join("")}</div>
   </div>`;
  const run=()=>{
    const id=$("#lt").value,g=$("#lg").value,r=matchAnswer(g,id,S.threshold),p=PLAYERS[id];
    const rt={exact:L.rExact,alias:L.rAlias,fuzzy:L.rFuzzy,surname:L.rSurname,none:L.rNone}[r.route];
    const v=r.ambiguous?`<span class="pill w">${L.amb}</span>`:(r.ok?`<span class="pill y">${L.yes}</span>`:`<span class="pill n">${L.no}</span>`);
    $("#ltrace").innerHTML=`
      <div><span>${L.kNorm}</span><span>${normalize(g)||"-"}</span></div>
      <div><span>${L.kAlias}</span><span>${(p.alt||[]).join(", ")||"-"}</span></div>
      <div><span>${L.kBest}</span><span>${r.matched||"-"}</span></div>
      <div><span>${L.kDist}</span><span>${r.dist===null?"-":r.dist}</span></div>
      <div><span>${L.kRoute}</span><span>${rt}</span></div>
      <div><span>${L.kVerdict}</span><span>${v}</span></div>`;
  };
  $("#lt").onchange=run; $("#lg").oninput=run;
  $("#lth").oninput=e=>{S.threshold=+e.target.value;$("#lthv").textContent=S.threshold;run();};
  run();
}

/* ---------- amorcage ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go);
});
paintHome();
</script>
